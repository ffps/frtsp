plugins {
    id 'com.android.application'
}

def tagVersion = System.getenv("GITHUB_REF_NAME") ?: ""
def cleanVersion = tagVersion.replaceFirst("^v", "")
if (!(cleanVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("Build must be started from a version tag vX.Y.Z; got: " + tagVersion)
}
def parts = cleanVersion.tokenize(".").collect { it.toInteger() }
def versionCodeValue = parts[0] * 1000000 + parts[1] * 1000 + parts[2]
if (versionCodeValue > 2100000000) throw new GradleException("versionCode is too large")

android {
    namespace 'com.ffps.frtsp'
    compileSdk 33

    defaultConfig {
        applicationId 'com.ffps.frtsp'
        minSdk 17
        targetSdk 28
        versionCode versionCodeValue
        versionName cleanVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
}
