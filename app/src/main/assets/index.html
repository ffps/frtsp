<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#003399">
<title>fRTSP</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g3' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230966cc'/%3E%3Cstop offset='1' stop-color='%23030639'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='url(%23g3)'/%3E%3Cpath d='M60 32 L30 51 L60 70 M60 50 L90 69 L60 88' fill='none' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --a:#003399;
  --bg:#f4f6fa;
  --line:#e1e5ed;
  --muted:#697386}
*{
  box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:#20242b;
  font:15px Arial}
header{
  height:58px;
  background:var(--a);
  color:#fff;
  box-shadow:0 2px 9px #172b4d38;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:4px;
  position:sticky;
  top:0;
  z-index:10}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  font-size:20px;
  font-weight:bold;
  color:#fff;
  margin-right:auto}
.brand-logo{
  width:32px;
  height:32px;
  flex:none;
  display:block}
.icon{
  border:0;
  background:none;
  color:#fff;
  font-size:22px;
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  cursor:pointer}
.icon svg{
  width:24px;
  height:24px;
  fill:currentColor}
.icon svg.line{
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round}
.icon:hover{
  background:rgba(255,255,255,.18)}
body.login-active main,body.login-active #toast{display:none}
main{
  max-width:1180px;
  margin:22px auto;
  padding:0 16px}
.heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px}
.heading h1{
  font-size:20px;
  margin:0 auto 0 0}
.pill{
  font-size:12px;
  padding:5px 10px;
  border-radius:20px;
  background:#edf0f5;
  color:#596273}
.ok{
  background:#e5f4ec;
  color:#18794e}
.bad{
  background:#fcebea;
  color:#b3261e}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(400px,1fr));
  gap:16px}
.camera{
  background:white;
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
  box-shadow:0 2px 8px #172b4d0c}
.preview{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:contain;
  background:#15191f}
.caminfo{
  padding:12px 14px;
  cursor:pointer}
.camera.disabled .preview{background:#15191f}
#imageViewer{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:8px;cursor:zoom-out}
#imageViewer.open{display:flex}
#imageViewer img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 4px 24px #0008;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.info-table{width:100%;border-collapse:collapse;font-size:14px}
.info-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.info-table td:first-child{width:43%;color:var(--muted)}
.info-table td:last-child{overflow-wrap:anywhere;font-weight:500}
.camrow{
  display:flex;
  align-items:center;
  gap:8px}
.camname{
  font-weight:bold;
  margin-right:auto}
.meta,.note{
  font-size:12px;
  color:var(--muted);
  margin-top:7px}
.empty{
  padding:45px;
  text-align:center;
  background:white;
  border:1px dashed #cbd2df;
  border-radius:10px;
  color:var(--muted)}
button.primary,button.secondary,button.danger{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px}
button.primary{
  background:var(--a);
  color:white}
button.secondary{
  background:#edf1f8;
  color:#24324a}
button.danger{
  background:#fbe9e8;
  color:#b3261e}
dialog{
  border:0;
  border-radius:12px;
  padding:0;
  width:min(550px,calc(100% - 28px));
  max-height:88vh;
  box-shadow:0 15px 50px #0004}
dialog::backdrop{
  background:#10182777}
#login.login-dialog{
  position:fixed;
  top:72px;
  left:0;
  right:0;
  margin:0 auto;
  width:100%;
  max-width:none;
  max-height:none;
  overflow:visible;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none}
#login.login-dialog::backdrop{
  background:transparent}
body.login-active #tools{display:none!important}
.login-card{
  width:calc(100% - 32px);
  max-width:320px;
  margin:40px auto 0;
  padding:16px;
  background:#fff;
  border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.login-card h2{
  margin:0 0 16px;
  font-size:20px;
  font-weight:500}
.login-card .field{
  width:100%;
  font:inherit;
  font-size:16px;
  padding:8px 0;
  border:0;
  border-bottom:2px solid var(--a);
  border-radius:0;
  background:none;
  outline:none;
  color:var(--text)}
.login-card .field:focus{
  border-bottom-color:var(--a)}
.login-error{
  color:#b3261e;
  min-height:20px;
  margin-top:8px;
  font-size:13px}
.login-submit{
  margin-top:8px;
  min-width:88px;
  background:var(--a);
  color:#fff;
  border:0;
  border-radius:4px;
  padding:0 20px;
  height:36px;
  box-shadow:0 2px 3px rgba(0,0,0,.3);
  font-size:14px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.5px;
  cursor:pointer}
.login-submit:hover{
  filter:brightness(.92)}
.dh{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center}
.dh h2{
  font-size:18px;
  margin:0 auto 0 0}
.close{
  border:0;
  background:none;
  font-size:24px;
  color:var(--muted);
  cursor:pointer}
.db{
  padding:18px 20px;
  overflow:auto}
.df{
  padding:13px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap}
.field{
  display:block;
  margin-bottom:13px}
.field span{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px}
.field input{
  width:100%;
  padding:11px;
  border:1px solid #cbd2df;
  border-radius:7px;
  font-size:15px}
.check{
  display:flex;
  gap:8px;
  align-items:center;
  margin:12px 0}
.kv{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:9px 12px;
  font-size:14px}
.kv div:nth-child(odd){
  color:var(--muted)}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#f4f6fa;
  padding:12px;
  border-radius:8px;
  font-size:12px}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#20242b;
  color:white;
  padding:11px 18px;
  border-radius:24px;
  opacity:0;
  z-index:5;
  transition:opacity .2s}
#toast.show{
  opacity:1}
@media(max-width:520px){
header{
  height:54px;
  padding:0 7px}
.brand{
  font-size:18px}
.brand-logo{
  width:29px;
  height:29px}
.icon{
  width:38px;
  height:38px}
.grid{
  grid-template-columns:1fr}
.kv{
  grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header>
<div class="brand">
<svg class="brand-logo" viewBox="0 0 120 120" role="img" aria-label="fRTSP">
  <path d="M60 32 L30 51 L60 70" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 50 L90 69 L60 88" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span>fRTSP</span>
</div>
<span id="tools" style="display:none;align-items:center;gap:4px">
<button class="icon" id="add" title="Добавить камеру" aria-label="Добавить камеру">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<button class="icon" id="settings" title="Настройки" aria-label="Настройки">
  <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19.39 10.23 22.15 11.04v1.92l-2.76.81-.91 2.2 1.38 2.53-1.36 1.36-2.53-1.38-2.2.91-.81 2.76h-1.92l-.81-2.76-2.2-.91-2.53 1.38-1.36-1.36 1.38-2.53-.91-2.2-2.76-.81v-1.92l2.76-.81.91-2.2L4.14 5.5 5.5 4.14l2.53 1.38 2.2-.91.81-2.76h1.92l.81 2.76 2.2.91 2.53-1.38 1.36 1.36-1.38 2.53zM15.4 12a3.4 3.4 0 1 0-6.8 0 3.4 3.4 0 0 0 6.8 0z"/></svg>
</button>
<button class="icon" id="info" title="Информация" aria-label="Информация">
  <svg class="line" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.6h.01"/></svg>
</button>
<button class="icon" id="refresh" title="Обновить" aria-label="Обновить">
  <svg viewBox="0 0 1024 1024"><path d="M771.8 794.9A384 384 0 0 1 128 512h64a320 320 0 0 0 555.7 216.4h-93a32 32 0 1 1 0-64h149a32 32 0 0 1 32 32v149a32 32 0 1 1-64 0zM276.3 295.6h93a32 32 0 0 1 0 64H220.2a32 32 0 0 1-32-32v-149a32 32 0 0 1 64 0V229a384 384 0 0 1 644 282.9h-64a320 320 0 0 0-555.8-216.4z"/></svg>
</button>
<button class="icon" id="logout" title="Выход" aria-label="Выход">
  <svg class="line" viewBox="0 0 24 24"><path d="M10 4H5v16h5"/><path d="m16 8 4 4-4 4M9 12h11"/></svg>
</button>
</span>
</header>
<main>
<div class="heading">
<h1>Камеры</h1>
<span id="service" class="pill">Загрузка…</span>

</div>
<div id="grid" class="grid">
</div>
</main>
<div id="imageViewer" aria-label="Увеличенное изображение"><img alt=""></div>
<div id="toast">
</div>
<dialog id="login" class="login-dialog">
<form id="loginForm" class="login-card">
<h2>Вход</h2>
<input class="field" id="password" type="password" placeholder="Пароль" required autocomplete="current-password">
<div id="loginError" class="login-error" hidden>Неверный пароль или API недоступно</div>
<button class="login-submit" type="submit">Войти</button>
</form>
</dialog>
<dialog id="cameraDlg">
<div class="dh">
<h2 id="cameraTitle">
</h2>
<button class="close" data-close="cameraDlg">×</button>
</div>
<div class="db" id="cameraBody">
</div>
<div class="df" id="cameraActions">
</div>
</dialog>
<dialog id="editDlg">
<div class="dh">
<h2 id="editTitle">
</h2>
<button class="close" data-close="editDlg">×</button>
</div>
<form id="editForm">
<div class="db">
<label class="field">
<span>Имя</span>
<input id="name" required pattern="[a-z][a-z0-9_]{0,31}">
</label>
<label class="field">
<span>RTSP URL</span>
<input id="url" required placeholder="rtsp://user:password@192.168.1.10/1/2">
</label>
<label class="field">
<span>Output FPS (1–60)</span>
<input id="fps" type="number" min="1" max="60" value="1" required>
</label>
<label class="field">
<span>JPEG Quality (1–100)</span>
<input id="quality" type="number" min="1" max="100" value="75" required>
</label>
<label class="check">
<input id="enabled" type="checkbox" checked> Камера включена</label>
</div>
<div class="df">
<button type="button" class="secondary" data-close="editDlg">Отмена</button>
<button class="primary">Сохранить</button>
</div>
</form>
</dialog>
<dialog id="settingsDlg">
<div class="dh">
<h2>Общие настройки</h2>
<button class="close" data-close="settingsDlg">×</button>
</div>
<form id="settingsForm">
<div class="db">
<label class="field">
<span>HTTP-порт</span>
<input id="port" type="number" min="1" max="65535" required>
</label>
<label class="field">
<span>Новый пароль API (пусто — не менять)</span>
<input id="newPassword" type="password" autocomplete="new-password">
</label>
<p class="note">Пользователь Basic Auth: api.</p>
</div>
<div class="df">
<button type="button" class="secondary" data-close="settingsDlg">Отмена</button>
<button class="primary">Сохранить</button>
</div>
</form>
</dialog>
<dialog id="infoDlg">
<div class="dh">
<h2>Информация</h2>
<button class="close" data-close="infoDlg">×</button>
</div>
<div class="db" id="infoBody">
</div>
<div class="df">
<button class="secondary" data-close="infoDlg">Закрыть</button>
</div>
</dialog>
<script>
(function() {
    var token=sessionStorage.getItem('frtsp_auth')||'', cfg=null, st=null, editing=null;
    function $(id) {
        return document.getElementById(id)
    }
    function close(id) {
        $(id).close()
    }
    function note(s) {
        $('toast').textContent=s;
        $('toast').className='show';
        setTimeout(function() {
            $('toast').className=''
        }, 2500)
    }
    function login() {
        $('loginError').hidden=true;
        document.body.classList.add('login-active');
        $('tools').style.display='none';
        if(!$('login').open)$('login').showModal()
    }
    function api(path, method, data) {
        var h= {
        };
        if(token)h.Authorization='Basic '+token;
        if(data!==undefined)h['Content-Type']='application/json';
        return fetch(path,  {
            method:method||'GET', headers:h, body:data===undefined?undefined:JSON.stringify(data), cache:'no-store'
        }).then(function(r) {
            if(r.status===401) {
                token='';
                sessionStorage.removeItem('frtsp_auth');
                login();
                throw Error('Требуется авторизация')
            }
            return r.text().then(function(t) {
                var j= {
                };
                try {
                    j=t?JSON.parse(t): {
                    }
                }
                catch(e) {
                }
                if(!r.ok)throw Error(j.error||('HTTP '+r.status));
                return j
            })
        })
    }
    document.querySelectorAll('[data-close]').forEach(function(b) {
        b.onclick=function() {
            close(b.getAttribute('data-close'))
        }
    });
    document.querySelectorAll('dialog:not(#login)').forEach(function(dlg) {
        dlg.addEventListener('click', function(e) {
            if(e.target!==dlg) return;
            var r=dlg.getBoundingClientRect();
            if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) {
                dlg.close();
            }
        });
    });
    $('loginForm').onsubmit=function(e) {
        e.preventDefault();
        token=btoa(unescape(encodeURIComponent('api:'+ $('password').value)));
        api('/api/v1/config').then(function(x) {
            sessionStorage.setItem('frtsp_auth', token);
            cfg=x;
            close('login');
            document.body.classList.remove('login-active');
            $('password').value='';
            refresh()
        }).catch(function() {
            $('loginError').hidden=false
        })
    };
    function refresh() {
        if(!token) {
            login();
            return
        }
        return Promise.all([api('/api/v1/config'), api('/api/v1/status')]).then(function(v) {
            cfg=v[0];
            st=v[1];
            $('tools').style.display='flex';
            render();

        }).catch(function(e) {
            if(isNetworkError(e)) {
                showConnectionLost();
            } else if(e.message!=='Требуется авторизация') {
                note(e.message)
            }
        })
    }
    function isNetworkError(e) {
        return e instanceof TypeError || /NetworkError|Failed to fetch|Load failed/i.test(e.message||'');
    }
    function showConnectionLost() {
        $('service').textContent='Нет связи с сервисом';
        $('service').className='pill bad';
    }
    function render() {
        var live=st.cameras||[], by={}, existing={};
        live.forEach(function(c) { by[c.name]=c });
        $('service').textContent=st.running?'Сервис работает':'Сервис остановлен';
        $('service').className='pill '+(st.running?'ok':'bad');
        var grid=$('grid');
        Array.prototype.forEach.call(grid.querySelectorAll('.camera[data-camera-name]'),function(card) {
            existing[card.getAttribute('data-camera-name')]=card;
        });
        if(!cfg.cameras.length) {
            grid.innerHTML='<div class="empty">Камер пока нет. Нажмите ＋, чтобы добавить камеру.</div>';
            return;
        }
        var empty=grid.querySelector('.empty');
        if(empty)empty.remove();
        cfg.cameras.forEach(function(c) {
            var s=by[c.name]||{}, card=existing[c.name], img, inf, row, n, p, m;
            if(!card) {
                card=document.createElement('article');
                card.className='camera';
                card.setAttribute('data-camera-name',c.name);
                img=document.createElement('img');
                img.className='preview';
                img.alt=c.name;
                img.draggable=false;
                inf=document.createElement('div');
                inf.className='caminfo';
                row=document.createElement('div');
                row.className='camrow';
                n=document.createElement('span');
                n.className='camname';
                p=document.createElement('span');
                row.appendChild(n);
                row.appendChild(p);
                m=document.createElement('div');
                m.className='meta';
                inf.appendChild(row);
                inf.appendChild(m);
                card.appendChild(img);
                card.appendChild(inf);
                grid.appendChild(card);
            } else {
                img=card.querySelector('.preview');
                inf=card.querySelector('.caminfo');
                n=inf.querySelector('.camname');
                p=inf.querySelector('.pill');
                m=inf.querySelector('.meta');
            }
            delete existing[c.name];
            card.className='camera'+(c.enabled?'':' disabled');
            n.textContent=c.name;
            p.className='pill '+(s.state==='streaming'?'ok':(c.enabled?'bad':''));
            p.textContent=c.enabled?(s.state||'ожидание'):'выключена';
            m.textContent=s.frame_age_ms>=0?(s.source_width||0)+'×'+(s.source_height||0)+' · '+(s.output_fps||0)+' FPS'+(Math.round(s.frame_age_ms/1000)>=1?' · '+Math.round(s.frame_age_ms/1000)+' сек назад':''):'нет кадра';
            inf.onclick=function() { showCamera(c.name) };
            if(c.enabled) {
                if(!img.getAttribute('src') || img._wasDisabled) {
                    img._wasDisabled=false;
                    img._snapshotAt=0;
                }
                if(!img._snapshotLoading && Date.now()-(img._snapshotAt||0)>=4500) {
                    img._snapshotLoading=true;
                    img._snapshotAt=Date.now();
                    var generation=img._previewGeneration||0;
                    var preload=new Image();
                    preload.onload=function() {
                        if(generation!==(img._previewGeneration||0))return;
                        img._snapshotLoading=false;
                        if(img.isConnected && !card.classList.contains('disabled')) {
                            img.src=preload.src;
                            img.style.opacity='1';
                        }
                    };
                    preload.onerror=function() {
                        if(generation!==(img._previewGeneration||0))return;
                        img._snapshotLoading=false;
                        if(img.isConnected && !card.classList.contains('disabled'))img.style.opacity='.45';
                    };
                    preload.src='/cam/'+encodeURIComponent(c.name)+'.jpg?t='+Date.now();
                }
                img.onclick=function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if(!c.enabled)return;
                    var viewer=$('imageViewer'), large=viewer.querySelector('img');
                    large.draggable=false;
                    large.src='/cam/'+encodeURIComponent(c.name);
                    viewer.classList.add('open');
                };
            } else {
                img._wasDisabled=true;
                img._previewGeneration=(img._previewGeneration||0)+1;
                img._snapshotAt=0;
                img._snapshotLoading=false;
                img.removeAttribute('src');
                img.style.opacity='1';
                img.onclick=null;
            }
        });
        Object.keys(existing).forEach(function(name) {
            existing[name].remove();
        });
    }
    $('imageViewer').onclick=function() {
        $('imageViewer').classList.remove('open');
        $('imageViewer').querySelector('img').removeAttribute('src');
    };
    $('imageViewer').querySelector('img').ondragstart=function(e) {
        e.preventDefault();
        return false;
    };
    $('imageViewer').querySelector('img').onmousedown=function(e) {
        e.preventDefault();
    };
    function showCamera(name) {
        var c=cfg.cameras.filter(function(x) {
            return x.name===name
        })[0], s=(st.cameras||[]).filter(function(x) {
            return x.name===name
        })[0]|| {
        };
        if(!c)return;
        $('cameraTitle').textContent=name;
        var kv=document.createElement('div');
        kv.className='kv';
        [['Состояние', s.state||'не запущена'], ['Включена', c.enabled?'да':'нет'], ['Разрешение', (s.source_width||0)+' × '+(s.source_height||0)], ['Output FPS', s.output_fps||0], ['Возраст кадра', s.frame_age_ms>=0?Math.round(s.frame_age_ms/1000)+' сек':'нет кадра'], ['Ошибка', s.last_error||'—'], ['RTSP URL', c.url||'']].forEach(function(p) {
            var a=document.createElement('div'), b=document.createElement('div');
            a.textContent=p[0];
            b.textContent=p[1];
            b.style.overflowWrap='anywhere';
            kv.appendChild(a);
            kv.appendChild(b)
        });
        $('cameraBody').innerHTML='';
        $('cameraBody').appendChild(kv);
        var actions=$('cameraActions');
        actions.innerHTML='';
        function action(label, path, cls) {
            var b=document.createElement('button');
            b.className=cls||'secondary';
            b.textContent=label;
            b.onclick=function() {
                api(path, 'POST',  {
                }).then(function() {
                    if(path.indexOf('/off')!==-1) c.enabled=false;
                    if(path.indexOf('/on')!==-1) c.enabled=true;
                    return refresh().then(function() {
                        if($('cameraDlg').open) {
                            close('cameraDlg');
                            showCamera(name);
                        }
                        note('Команда выполнена');
                    });
                }).catch(function(e) {
                    note(e.message)
                })
            };
            actions.appendChild(b)
        }
        action(c.enabled?'Выключить':'Включить', '/api/v1/camera/'+encodeURIComponent(name)+'/'+(c.enabled?'off':'on'));
        action('Перезапустить', '/api/v1/camera/'+encodeURIComponent(name)+'/restart');
        var edit=document.createElement('button');
        edit.className='secondary';
        edit.textContent='Настроить';
        edit.onclick=function() {
            close('cameraDlg');
            editCamera(name)
        };
        actions.appendChild(edit);
        var del=document.createElement('button');
        del.className='danger';
        del.textContent='Удалить';
        del.onclick=function() {
            if(confirm('Удалить камеру '+name+'?'))api('/api/v1/camera/'+encodeURIComponent(name), 'DELETE',  {
            }).then(function() {
                close('cameraDlg');
                note('Камера удалена');
                refresh()
            }).catch(function(e) {
                note(e.message)
            })
        };
        actions.appendChild(del);
        $('cameraDlg').showModal()
    }
    function editCamera(name) {
        editing=name;
        var c=name?cfg.cameras.filter(function(x) {
            return x.name===name
        })[0]:null;
        $('editTitle').textContent=c?'Настройки камеры':'Добавить камеру';
        $('name').value=c?c.name:'';
        $('name').disabled=!!c;
        $('url').value=c?c.url:'';
        $('fps').value=c?c.fps:1;
        $('quality').value=c?c.quality:75;
        $('enabled').checked=c?c.enabled:true;
        $('editDlg').showModal()
    }
    $('editForm').onsubmit=function(e) {
        e.preventDefault();
        var name=$('name').value.trim(), url=$('url').value.trim();
        if(url&&!/^rtsp:\/\//i.test(url))url='rtsp://'+url;
        var data= {
            url:url, enabled:$('enabled').checked, fps:Number($('fps').value), quality:Number($('quality').value)
        };
        api(editing?'/api/v1/camera/'+encodeURIComponent(editing)+'/config':'/api/v1/camera/'+encodeURIComponent(name), editing?'POST':'PUT', data).then(function() {
            close('editDlg');
            note('Настройки сохранены');
            refresh()
        }).catch(function(e) {
            note(e.message)
        })
    };
    $('add').onclick=function() {
        editCamera(null)
    };
    $('settings').onclick=function() {
        if(!cfg)return;
        $('port').value=cfg.port||cfg.http_port||8554;
        $('newPassword').value='';
        $('settingsDlg').showModal()
    };
    $('settingsForm').onsubmit=function(e) {
        e.preventDefault();
        var data= {
            port:Number($('port').value)
        }, pw=$('newPassword').value;
        if(pw)data.password=pw;
        api('/api/v1/config', 'POST', data).then(function() {
            close('settingsDlg');
            if(pw) {
                token=btoa(unescape(encodeURIComponent('api:'+pw)));
                sessionStorage.setItem('frtsp_auth', token)
            }
            note('Настройки сохранены');
            setTimeout(refresh, 350)
        }).catch(function(e) {
            note(e.message)
        })
    };
    $('info').onclick=function() {
        Promise.all([api('/api/v1/version'), api('/api/v1/status'), api('/api/v1/stats')]).then(function(v) {
            var x=v[0], current=v[1], s=v[2], mem=current.memory||{}, cpu=current.cpu||{}, totals=s.totals||{};
            var rows=[
                ['Версия',x.version||'—'],['FFmpeg',x.ffmpeg||'—'],
                ['IP-адрес',window.location.hostname||'—'],['HTTP-порт',current.port||cfg.port||'—'],
                ['Время работы',formatDuration(s.uptime_seconds||current.uptime_seconds||0)],
                ['Загрузка CPU сейчас',percent(cpu.system_usage_percent)],
                ['Средняя загрузка CPU',percent((s.cpu||{}).average_usage_percent)],
                ['Загрузка CPU процессом fRTSP сейчас',percent(cpu.process_usage_percent)],
                ['Средняя загрузка CPU процессом fRTSP',percent((s.cpu||{}).average_process_usage_percent)],
                ['Использование RAM (heap)',mb(mem.heap_used_mb)+' / '+mb(mem.heap_max_mb)],
                ['Native heap',mb(mem.native_heap_mb)],
                ['Свободная системная память',mb(mem.system_available_mb)+' / '+mb(mem.system_total_mb)],
                ['Процессов FFmpeg',current.ffmpeg_processes==null?'—':current.ffmpeg_processes],
                ['JPEG кадров',totals.jpeg_frames||0],['Перезапуски FFmpeg',totals.ffmpeg_restarts||0],['Ошибки камер',totals.camera_errors||0]
            ];
            var table=document.createElement('table'); table.className='info-table';
            rows.forEach(function(r) {
                var tr=document.createElement('tr'), a=document.createElement('td'), b=document.createElement('td');
                a.textContent=r[0]; b.textContent=r[1]; tr.appendChild(a); tr.appendChild(b); table.appendChild(tr);
            });
            $('infoBody').innerHTML=''; $('infoBody').appendChild(table);
            var a=document.createElement('a'); a.href='/api'; a.target='_blank'; a.textContent='Справочник API (JSON)';
            a.style.display='inline-block'; a.style.marginTop='14px'; $('infoBody').appendChild(a);
            $('infoDlg').showModal()
        }).catch(function(e) { note(e.message) })
    };
    function mb(value) { return value==null?'—':value+' MB' }
    function percent(value) { return value==null?'—':value+'%' }
    function formatDuration(seconds) {
        seconds=Math.max(0,Number(seconds)||0);
        var h=Math.floor(seconds/3600), m=Math.floor(seconds%3600/60), s=Math.floor(seconds%60);
        return (h?h+' ч ':'')+(m?m+' мин ':'')+s+' сек';
    }
    $('refresh').onclick=refresh;
    $('logout').onclick=function() {
        token='';
        sessionStorage.removeItem('frtsp_auth');
        login()
    };
    if(token)api('/api/v1/config').then(function(x) {
        cfg=x;
        refresh()
    }).catch(function(e) {
        if(isNetworkError(e)) showConnectionLost();
        else if(e.message!=='Требуется авторизация') login();
    });
    else login();
    setInterval(function() {
        if(token)refresh()
    }, 5000);
})();
</script>
</body>
</html>
