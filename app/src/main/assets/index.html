<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#003399">
<title>fRTSP</title>
<style>
:root{
  --a:#003399;
  --bg:#f4f6fa;
  --line:#e1e5ed;
  --muted:#697386}
*{
  box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:#20242b;
  font:15px Arial}
header{
  height:58px;
  background:white;
  box-shadow:0 2px 9px #172b4d18;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:8px;
  position:sticky;
  top:0}
.brand{
  font-size:20px;
  font-weight:bold;
  color:var(--a);
  margin-right:auto}
.icon{
  border:0;
  background:none;
  color:#4c5668;
  font-size:22px;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer}
.icon:hover{
  background:#edf1f8;
  color:var(--a)}
main{
  max-width:1180px;
  margin:22px auto;
  padding:0 16px}
.heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px}
.heading h1{
  font-size:20px;
  margin:0 auto 0 0}
.pill{
  font-size:12px;
  padding:5px 10px;
  border-radius:20px;
  background:#edf0f5;
  color:#596273}
.ok{
  background:#e5f4ec;
  color:#18794e}
.bad{
  background:#fcebea;
  color:#b3261e}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:16px}
.camera{
  background:white;
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 2px 8px #172b4d0c}
.preview{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:contain;
  background:#15191f}
.caminfo{
  padding:12px 14px}
.camrow{
  display:flex;
  align-items:center;
  gap:8px}
.camname{
  font-weight:bold;
  margin-right:auto}
.meta,.note{
  font-size:12px;
  color:var(--muted);
  margin-top:7px}
.empty{
  padding:45px;
  text-align:center;
  background:white;
  border:1px dashed #cbd2df;
  border-radius:10px;
  color:var(--muted)}
button.primary,button.secondary,button.danger{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px}
button.primary{
  background:var(--a);
  color:white}
button.secondary{
  background:#edf1f8;
  color:#24324a}
button.danger{
  background:#fbe9e8;
  color:#b3261e}
dialog{
  border:0;
  border-radius:12px;
  padding:0;
  width:min(550px,calc(100% - 28px));
  max-height:88vh;
  box-shadow:0 15px 50px #0004}
dialog::backdrop{
  background:#10182777}
.dh{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center}
.dh h2{
  font-size:18px;
  margin:0 auto 0 0}
.close{
  border:0;
  background:none;
  font-size:24px;
  color:var(--muted);
  cursor:pointer}
.db{
  padding:18px 20px;
  overflow:auto}
.df{
  padding:13px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap}
.field{
  display:block;
  margin-bottom:13px}
.field span{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px}
.field input{
  width:100%;
  padding:11px;
  border:1px solid #cbd2df;
  border-radius:7px;
  font-size:15px}
.check{
  display:flex;
  gap:8px;
  align-items:center;
  margin:12px 0}
.kv{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:9px 12px;
  font-size:14px}
.kv div:nth-child(odd){
  color:var(--muted)}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#f4f6fa;
  padding:12px;
  border-radius:8px;
  font-size:12px}
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#20242b;
  color:white;
  padding:11px 18px;
  border-radius:24px;
  opacity:0;
  z-index:5;
  transition:opacity .2s}
#toast.show{
  opacity:1}
@media(max-width:520px){
header{
  height:54px;
  padding:0 7px}
.brand{
  font-size:18px}
.grid{
  grid-template-columns:1fr}
.kv{
  grid-template-columns:110px 1fr}
}
</style>
</head>
<body>
<header>
<div class="brand">fRTSP</div>
<button class="icon" id="settings" title="Настройки">⚙</button>
<button class="icon" id="refresh" title="Обновить">↻</button>
<button class="icon" id="info" title="Информация">ⓘ</button>
<button class="icon" id="add" title="Добавить камеру">＋</button>
<button class="icon" id="logout" title="Выход">⇥</button>
</header>
<main>
<div class="heading">
<h1>Камеры</h1>
<span id="service" class="pill">Загрузка…</span>
<span id="updated" class="note">
</span>
</div>
<div id="grid" class="grid">
</div>
</main>
<div id="toast">
</div>
<dialog id="login">
<div class="dh">
<h2>Авторизация</h2>
</div>
<form id="loginForm">
<div class="db">
<p class="note">Basic Auth · пользователь api. Пароль хранится только в текущей вкладке.</p>
<label class="field">
<span>Пароль API</span>
<input id="password" type="password" required autocomplete="current-password">
</label>
<div id="loginError" class="pill bad" hidden>Неверный пароль или API недоступно</div>
</div>
<div class="df">
<button class="primary">Войти</button>
</div>
</form>
</dialog>
<dialog id="cameraDlg">
<div class="dh">
<h2 id="cameraTitle">
</h2>
<button class="close" data-close="cameraDlg">×</button>
</div>
<div class="db" id="cameraBody">
</div>
<div class="df" id="cameraActions">
</div>
</dialog>
<dialog id="editDlg">
<div class="dh">
<h2 id="editTitle">
</h2>
<button class="close" data-close="editDlg">×</button>
</div>
<form id="editForm">
<div class="db">
<label class="field">
<span>Имя</span>
<input id="name" required pattern="[a-z][a-z0-9_]{0,31}">
</label>
<label class="field">
<span>RTSP URL</span>
<input id="url" required placeholder="rtsp://user:password@192.168.1.10/1/2">
</label>
<label class="field">
<span>Output FPS (1–60)</span>
<input id="fps" type="number" min="1" max="60" value="1" required>
</label>
<label class="field">
<span>JPEG Quality (1–100)</span>
<input id="quality" type="number" min="1" max="100" value="75" required>
</label>
<label class="check">
<input id="enabled" type="checkbox" checked> Камера включена</label>
</div>
<div class="df">
<button type="button" class="secondary" data-close="editDlg">Отмена</button>
<button class="primary">Сохранить</button>
</div>
</form>
</dialog>
<dialog id="settingsDlg">
<div class="dh">
<h2>Общие настройки</h2>
<button class="close" data-close="settingsDlg">×</button>
</div>
<form id="settingsForm">
<div class="db">
<label class="field">
<span>HTTP-порт</span>
<input id="port" type="number" min="1" max="65535" required>
</label>
<label class="field">
<span>Новый пароль API (пусто — не менять)</span>
<input id="newPassword" type="password" autocomplete="new-password">
</label>
<p class="note">Пользователь Basic Auth: api.</p>
</div>
<div class="df">
<button type="button" class="secondary" data-close="settingsDlg">Отмена</button>
<button class="primary">Сохранить</button>
</div>
</form>
</dialog>
<dialog id="infoDlg">
<div class="dh">
<h2>Информация</h2>
<button class="close" data-close="infoDlg">×</button>
</div>
<div class="db" id="infoBody">
</div>
<div class="df">
<button class="secondary" data-close="infoDlg">Закрыть</button>
</div>
</dialog>
<script>
(function() {
    var token=sessionStorage.getItem('frtsp_auth')||'', cfg=null, st=null, editing=null;
    function $(id) {
        return document.getElementById(id)
    }
    function close(id) {
        $(id).close()
    }
    function note(s) {
        $('toast').textContent=s;
        $('toast').className='show';
        setTimeout(function() {
            $('toast').className=''
        }, 2500)
    }
    function login() {
        $('loginError').hidden=true;
        if(!$('login').open)$('login').showModal()
    }
    function api(path, method, data) {
        var h= {
        };
        if(token)h.Authorization='Basic '+token;
        if(data!==undefined)h['Content-Type']='application/json';
        return fetch(path,  {
            method:method||'GET', headers:h, body:data===undefined?undefined:JSON.stringify(data), cache:'no-store'
        }).then(function(r) {
            if(r.status===401) {
                token='';
                sessionStorage.removeItem('frtsp_auth');
                login();
                throw Error('Требуется авторизация')
            }
            return r.text().then(function(t) {
                var j= {
                };
                try {
                    j=t?JSON.parse(t): {
                    }
                }
                catch(e) {
                }
                if(!r.ok)throw Error(j.error||('HTTP '+r.status));
                return j
            })
        })
    }
    document.querySelectorAll('[data-close]').forEach(function(b) {
        b.onclick=function() {
            close(b.getAttribute('data-close'))
        }
    });
    $('loginForm').onsubmit=function(e) {
        e.preventDefault();
        token=btoa(unescape(encodeURIComponent('api:'+ $('password').value)));
        api('/api/v1/config').then(function(x) {
            sessionStorage.setItem('frtsp_auth', token);
            cfg=x;
            close('login');
            $('password').value='';
            refresh()
        }).catch(function() {
            $('loginError').hidden=false
        })
    };
    function refresh() {
        if(!token) {
            login();
            return
        }
        Promise.all([api('/api/v1/config'), api('/api/v1/status')]).then(function(v) {
            cfg=v[0];
            st=v[1];
            render();
            $('updated').textContent=new Date().toLocaleTimeString()
        }).catch(function(e) {
            if(e.message!=='Требуется авторизация')note(e.message)
        })
    }
    function render() {
        var live=st.cameras||[], by= {
        };
        live.forEach(function(c) {
            by[c.name]=c
        });
        $('service').textContent=st.running?'Сервис работает':'Сервис остановлен';
        $('service').className='pill '+(st.running?'ok':'bad');
        var grid=$('grid');
        grid.innerHTML='';
        if(!cfg.cameras.length) {
            grid.innerHTML='<div class="empty">Камер пока нет. Нажмите ＋, чтобы добавить камеру.</div>';
            return
        }
        cfg.cameras.forEach(function(c) {
            var s=by[c.name]|| {
            }, card=document.createElement('article');
            card.className='camera';
            card.onclick=function() {
                showCamera(c.name)
            };
            var img=document.createElement('img');
            img.className='preview';
            img.alt=c.name;
            img.src='/cam/'+encodeURIComponent(c.name)+'.jpg';
            img.onerror=function() {
                img.style.opacity='.25'
            };
            var inf=document.createElement('div');
            inf.className='caminfo';
            var row=document.createElement('div');
            row.className='camrow';
            var n=document.createElement('span');
            n.className='camname';
            n.textContent=c.name;
            var p=document.createElement('span');
            p.className='pill '+(s.state==='streaming'?'ok':(c.enabled?'bad':''));
            p.textContent=c.enabled?(s.state||'ожидание'):'выключена';
            row.appendChild(n);
            row.appendChild(p);
            var m=document.createElement('div');
            m.className='meta';
            m.textContent=(s.source_width||0)+'×'+(s.source_height||0)+' · '+(s.output_fps||0)+' FPS · '+(s.frame_age_ms>=0?Math.round(s.frame_age_ms/1000)+' сек назад':'нет кадра');
            inf.appendChild(row);
            inf.appendChild(m);
            card.appendChild(img);
            card.appendChild(inf);
            grid.appendChild(card)
        })
    }
    function showCamera(name) {
        var c=cfg.cameras.filter(function(x) {
            return x.name===name
        })[0], s=(st.cameras||[]).filter(function(x) {
            return x.name===name
        })[0]|| {
        };
        if(!c)return;
        $('cameraTitle').textContent=name;
        var kv=document.createElement('div');
        kv.className='kv';
        [['Состояние', s.state||'не запущена'], ['Включена', c.enabled?'да':'нет'], ['Разрешение', (s.source_width||0)+' × '+(s.source_height||0)], ['Output FPS', s.output_fps||0], ['Возраст кадра', s.frame_age_ms>=0?Math.round(s.frame_age_ms/1000)+' сек':'нет кадра'], ['Ошибка', s.last_error||'—'], ['RTSP URL', c.url||'']].forEach(function(p) {
            var a=document.createElement('div'), b=document.createElement('div');
            a.textContent=p[0];
            b.textContent=p[1];
            b.style.overflowWrap='anywhere';
            kv.appendChild(a);
            kv.appendChild(b)
        });
        $('cameraBody').innerHTML='';
        $('cameraBody').appendChild(kv);
        var actions=$('cameraActions');
        actions.innerHTML='';
        function action(label, path, cls) {
            var b=document.createElement('button');
            b.className=cls||'secondary';
            b.textContent=label;
            b.onclick=function() {
                api(path, 'POST',  {
                }).then(function() {
                    close('cameraDlg');
                    note('Команда выполнена');
                    refresh()
                }).catch(function(e) {
                    note(e.message)
                })
            };
            actions.appendChild(b)
        }
        action(c.enabled?'Выключить':'Включить', '/api/v1/camera/'+encodeURIComponent(name)+'/'+(c.enabled?'off':'on'));
        action('Перезапустить', '/api/v1/camera/'+encodeURIComponent(name)+'/restart');
        var edit=document.createElement('button');
        edit.className='secondary';
        edit.textContent='Настроить';
        edit.onclick=function() {
            close('cameraDlg');
            editCamera(name)
        };
        actions.appendChild(edit);
        var del=document.createElement('button');
        del.className='danger';
        del.textContent='Удалить';
        del.onclick=function() {
            if(confirm('Удалить камеру '+name+'?'))api('/api/v1/camera/'+encodeURIComponent(name), 'DELETE',  {
            }).then(function() {
                close('cameraDlg');
                note('Камера удалена');
                refresh()
            }).catch(function(e) {
                note(e.message)
            })
        };
        actions.appendChild(del);
        $('cameraDlg').showModal()
    }
    function editCamera(name) {
        editing=name;
        var c=name?cfg.cameras.filter(function(x) {
            return x.name===name
        })[0]:null;
        $('editTitle').textContent=c?'Настройки камеры':'Добавить камеру';
        $('name').value=c?c.name:'';
        $('name').disabled=!!c;
        $('url').value=c?c.url:'';
        $('fps').value=c?c.fps:1;
        $('quality').value=c?c.quality:75;
        $('enabled').checked=c?c.enabled:true;
        $('editDlg').showModal()
    }
    $('editForm').onsubmit=function(e) {
        e.preventDefault();
        var name=$('name').value.trim(), url=$('url').value.trim();
        if(url&&!/^rtsp:\/\//i.test(url))url='rtsp://'+url;
        var data= {
            url:url, enabled:$('enabled').checked, fps:Number($('fps').value), quality:Number($('quality').value)
        };
        api(editing?'/api/v1/camera/'+encodeURIComponent(editing)+'/config':'/api/v1/camera/'+encodeURIComponent(name), editing?'POST':'PUT', data).then(function() {
            close('editDlg');
            note('Настройки сохранены');
            refresh()
        }).catch(function(e) {
            note(e.message)
        })
    };
    $('add').onclick=function() {
        editCamera(null)
    };
    $('settings').onclick=function() {
        if(!cfg)return;
        $('port').value=cfg.port||cfg.http_port||8554;
        $('newPassword').value='';
        $('settingsDlg').showModal()
    };
    $('settingsForm').onsubmit=function(e) {
        e.preventDefault();
        var data= {
            port:Number($('port').value)
        }, pw=$('newPassword').value;
        if(pw)data.password=pw;
        api('/api/v1/config', 'POST', data).then(function() {
            close('settingsDlg');
            if(pw) {
                token=btoa(unescape(encodeURIComponent('api:'+pw)));
                sessionStorage.setItem('frtsp_auth', token)
            }
            note('Настройки сохранены');
            setTimeout(refresh, 350)
        }).catch(function(e) {
            note(e.message)
        })
    };
    $('info').onclick=function() {
        Promise.all([api('/api/v1/version'), api('/api/v1/stats')]).then(function(v) {
            var x=v[0], s=v[1], p=document.createElement('pre');
            p.textContent='Версия: '+x.version+'\nFFmpeg: '+x.ffmpeg+'\nВремя работы: '+(s.uptime_seconds||0)+' сек\nJPEG кадров: '+((s.totals|| {
            }).jpeg_frames||0)+'\nПерезапуски FFmpeg: '+((s.totals|| {
            }).ffmpeg_restarts||0)+'\nОшибки камер: '+((s.totals|| {
            }).camera_errors||0);
            $('infoBody').innerHTML='';
            $('infoBody').appendChild(p);
            var a=document.createElement('a');
            a.href='/api';
            a.target='_blank';
            a.textContent='Справочник API (JSON)';
            $('infoBody').appendChild(a);
            $('infoDlg').showModal()
        }).catch(function(e) {
            note(e.message)
        })
    };
    $('refresh').onclick=refresh;
    $('logout').onclick=function() {
        token='';
        sessionStorage.removeItem('frtsp_auth');
        login()
    };
    if(token)api('/api/v1/config').then(function(x) {
        cfg=x;
        refresh()
    }).catch(login);
    else login();
    setInterval(function() {
        if(token)refresh()
    }, 5000);
})();
</script>
</body>
</html>
